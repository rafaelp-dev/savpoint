spring.application.name=savpoint

## Database Configuration
spring.datasource.url=SUA_URL_DE_CONEXAO_AQUI
spring.datasource.username=SEU_USUÁRIO_AQUI
spring.datasource.password=SUA_SENHA_AQUI
spring.datasource.driver-class-name=org.postgresql.Driver

## Jpa - Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

## Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

## Server Configuration
server.error.include-stacktrace=never

## JWT Configuration
jwt.secret=SUA_SECRET
jwt.expiration=SEU_TEMPO_DE_EXPIRAÇÃO

## Coment this line if you want to use the default profile
spring.profiles.active=local